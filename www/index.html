<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PescaPlus</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #ffffff; color: #0f1417;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .wrap { text-align: center; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #0a7d72;
    display: inline-block; margin: 0 3px; animation: bounce 1.1s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
  h1 { font-size: 15px; font-weight: 800; letter-spacing: 0.02em; margin: 16px 0 8px; }
</style>
</head>
<body>
  <!--
    Esta página casi nunca se ve: Capacitor está configurado con server.url
    apuntando a la web en producción (ver capacitor.config.ts), así que la app
    carga directamente pescaplus.es dentro del WebView nativo. Este archivo
    solo hace falta porque la CLI de Capacitor exige que webDir exista con
    contenido — sirve de pantalla de carga si el arranque tarda un instante.
  -->
  <div class="wrap">
    <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <h1>PESCAPLUS</h1>
  </div>
</body>
</html>
